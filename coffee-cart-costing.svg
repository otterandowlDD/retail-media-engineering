<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Coffee Cart Cost Estimation</title>
<desc id="d">Portfolio case study visual showing coffee cart, BOQ and cost breakdown in Thai baht.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f4ede2"/><stop offset="1" stop-color="#dcc8ad"/></linearGradient>
  <linearGradient id="cart" x1="0" x2="1"><stop stop-color="#eee0cc"/><stop offset="1" stop-color="#c8a47d"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".18"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="72" y="62" width="260" height="52" rx="20" fill="#8b6748"/>
<text x="202" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#fff">Portfolio Case Study</text>
<text x="74" y="210" font-family="Georgia,serif" font-size="78" font-weight="700" fill="#211f1c">Coffee Cart</text>
<text x="74" y="292" font-family="Georgia,serif" font-size="78" font-weight="700" fill="#211f1c">Cost Estimation</text>
<text x="76" y="350" font-family="Arial,sans-serif" font-size="26" letter-spacing="2" fill="#6d655c">BOQ • COST BUILD-UP • OVERHEAD • MARGIN</text>

<g filter="url(#s)">
  <rect x="690" y="150" width="610" height="470" rx="38" fill="#181614"/>
  <rect x="725" y="214" width="540" height="310" rx="20" fill="url(#cart)"/>
  <rect x="765" y="260" width="235" height="205" rx="14" fill="#f0eadf"/>
  <rect x="1020" y="260" width="205" height="205" rx="14" fill="#b3835e"/>
  <path d="M1036 260v205m30-205v205m30-205v205m30-205v205m30-205v205m30-205v205" stroke="#7b5539" stroke-width="8"/>
  <rect x="742" y="180" width="500" height="40" rx="16" fill="#a87d56"/>
  <path d="M775 180V116M1210 180V116" stroke="#171411" stroke-width="16"/>
  <rect x="748" y="100" width="490" height="42" rx="20" fill="#b58960"/>
  <circle cx="790" cy="548" r="92" fill="#171411"/><circle cx="790" cy="548" r="62" fill="#d6c4aa"/>
  <circle cx="1190" cy="548" r="40" fill="#171411"/><circle cx="1190" cy="548" r="18" fill="#d6c4aa"/>
  <rect x="816" y="225" width="180" height="88" rx="10" fill="#a9a29a"/>
  <rect x="1020" y="205" width="70" height="110" rx="10" fill="#272522"/>
  <ellipse cx="1055" cy="202" rx="42" ry="16" fill="#5a4634"/>
  <rect x="1110" y="230" width="42" height="78" rx="6" fill="#f2e9dc"/>
</g>

<g filter="url(#s)">
  <rect x="74" y="452" width="540" height="330" rx="22" fill="#fffdf9" transform="rotate(-2 74 452)"/>
  <text x="110" y="500" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#27231f">Bill of Quantities (BOQ)</text>
  <text x="110" y="540" font-family="Arial,sans-serif" font-size="16" fill="#685e54">Description</text>
  <text x="455" y="540" font-family="Arial,sans-serif" font-size="16" fill="#685e54">Amount (THB)</text>
  <line x1="108" y1="554" x2="560" y2="554" stroke="#d8cec2"/>
  <text x="110" y="590" font-family="Arial,sans-serif" font-size="16" fill="#403a34">Steel frame + fabrication</text><text x="500" y="590" text-anchor="end" font-family="Arial,sans-serif" font-size="16">2,149</text>
  <text x="110" y="625" font-family="Arial,sans-serif" font-size="16" fill="#403a34">Top + HPL + panels</text><text x="500" y="625" text-anchor="end" font-family="Arial,sans-serif" font-size="16">3,560</text>
  <text x="110" y="660" font-family="Arial,sans-serif" font-size="16" fill="#403a34">Casters + finishing + signage</text><text x="500" y="660" text-anchor="end" font-family="Arial,sans-serif" font-size="16">1,267</text>
  <text x="110" y="695" font-family="Arial,sans-serif" font-size="16" fill="#403a34">Consumables + delivery</text><text x="500" y="695" text-anchor="end" font-family="Arial,sans-serif" font-size="16">807.80</text>
  <line x1="108" y1="713" x2="560" y2="713" stroke="#d8cec2"/>
  <text x="110" y="746" font-family="Arial,sans-serif" font-size="17" font-weight="700">Direct Cost</text><text x="500" y="746" text-anchor="end" font-family="Arial,sans-serif" font-size="17" font-weight="700">฿7,783.80</text>
</g>

<g filter="url(#s)">
  <rect x="1320" y="72" width="224" height="354" rx="28" fill="#fffaf2"/>
  <text x="1432" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#29241f">Cost Summary</text>
  <circle cx="1432" cy="218" r="72" fill="none" stroke="#d7c4aa" stroke-width="28"/>
  <circle cx="1432" cy="218" r="72" fill="none" stroke="#8b6748" stroke-width="28" stroke-dasharray="285 168" transform="rotate(-90 1432 218)"/>
  <text x="1432" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#29241f">฿9,729.75</text>
  <text x="1432" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#6c6258">Total Cost</text>
  <text x="1350" y="304" font-family="Arial,sans-serif" font-size="15" fill="#574e45">Direct Cost</text><text x="1510" y="304" text-anchor="end" font-family="Arial,sans-serif" font-size="15">฿7,783.80</text>
  <text x="1350" y="336" font-family="Arial,sans-serif" font-size="15" fill="#574e45">Overhead 20%</text><text x="1510" y="336" text-anchor="end" font-family="Arial,sans-serif" font-size="15">฿1,556.76</text>
  <text x="1350" y="368" font-family="Arial,sans-serif" font-size="15" fill="#574e45">Contingency 5%</text><text x="1510" y="368" text-anchor="end" font-family="Arial,sans-serif" font-size="15">฿389.19</text>
</g>

<rect x="1320" y="460" width="224" height="218" rx="28" fill="#201d1a"/>
<text x="1432" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" letter-spacing="1" fill="#d7ff72">RECOMMENDED</text>
<text x="1432" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">฿14,000</text>
<text x="1432" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#c8c0b7">Selling Price</text>
<text x="1432" y="634" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Gross Margin ≈ 30.5%</text>
<text x="74" y="850" font-family="Arial,sans-serif" font-size="18" fill="#6d655c">Market benchmark → Quantity take-off → Supplier cost → Labour → OH → Margin → Selling price</text>
</svg>