<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Retail media engineering workflow</title><desc id="desc">Abstract engineering grid connecting retail media campaign planning to site execution.</desc><rect width="1200" height="900" rx="40" fill="#0f1319"/><g stroke="#293141" stroke-width="2" opacity=".8"><path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200M0 750h1200"/><path d="M150 0v900M300 0v900M450 0v900M600 0v900M750 0v900M900 0v900M1050 0v900"/></g><g fill="none" stroke="#d7ff72" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M180 620L360 470l170 90 190-260 300 110"/><circle cx="180" cy="620" r="22" fill="#d7ff72"/><circle cx="360" cy="470" r="22" fill="#d7ff72"/><circle cx="530" cy="560" r="22" fill="#d7ff72"/><circle cx="720" cy="300" r="22" fill="#d7ff72"/><circle cx="1020" cy="410" r="22" fill="#d7ff72"/></g><g font-family="Arial,Helvetica,sans-serif" fill="#f5f7fb"><text x="85" y="130" font-size="54" font-weight="700">Campaign → Engineering → Rollout</text><text x="86" y="190" font-size="26" fill="#aeb6c3">Site survey · BOQ · Vendor · Installation · QC</text></g><g fill="#171d26" stroke="#313a4c" stroke-width="3"><rect x="120" y="690" width="240" height="100" rx="26"/><rect x="420" y="690" width="240" height="100" rx="26"/><rect x="720" y="690" width="240" height="100" rx="26"/></g><g font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#f5f7fb"><text x="240" y="750">SITE</text><text x="540" y="750">COST</text><text x="840" y="750">ROLLOUT</text></g></svg>